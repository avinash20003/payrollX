name: payrollx

services:
  app:
    container_name: payrollx-app
    image: payrollx-app:local
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      HOSTNAME: 0.0.0.0
      PORT: 8080
      FRONTEND_PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in deployment/.env}
      PGUSER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER in deployment/.env}
      PGPASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD in deployment/.env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in deployment/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deployment/.env}
      BOOTSTRAP_PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env}
      BOOTSTRAP_PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
      DATABASE_URL: postgresql://${APP_DB_USER:?Set APP_DB_USER in deployment/.env}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deployment/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in deployment/.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in deployment/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deployment/.env}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks:
      - payrollx-internal
      - payrollx-edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all([
            fetch('http://127.0.0.1:8080/api/health'),
            fetch('http://127.0.0.1:8080/login')
          ]).then((responses) => process.exit(responses.every((response) => response.ok) ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    container_name: payrollx-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deployment/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
    volumes:
      - payrollx_postgres_data:/var/lib/postgresql
    networks:
      - payrollx-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  payrollx-internal:
    internal: true
  payrollx-edge: {}

volumes:
  payrollx_postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-payrollx_postgres_data}
